[project]
name = "csol"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg==0.32.0",
    "fastapi==0.165.0",
    "mcp==1.30.0",
    "pydantic==2.14.4",
    "pyjwt==2.15.1",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis==2.40.0",
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
